  <script>
  (() => {try{if('scrollRestoration' in history)history.scrollRestoration='manual';
    let data=null;
    const raw=sessionStorage.getItem('portfolioReturnTransition')||sessionStorage.getItem('portfolioReverseTransition');
    if(raw)data=JSON.parse(raw);
    if(!data){const lastRaw=sessionStorage.getItem('portfolioLastDetail');if(lastRaw){const last=JSON.parse(lastRaw);if(last?.origin?.path===location.pathname&&Date.now()-(last.at||0)<20000)data=last;}}
    if(!data?.image)return;
    document.documentElement.classList.add('reverse-arrival-pending');
    document.documentElement.style.setProperty('--transition-image',`url("${String(data.image).replace(/["\\]/g,'\\$&')}")`);
  }catch{}})();
  </script>
  <style>html,body{margin:0;background:#081113}html.reverse-arrival-pending::before{content:"";position:fixed;inset:0;z-index:9997;background:#081113 var(--transition-image) center/cover no-repeat;pointer-events:none}</style><meta name="theme-color" content="#081113">
