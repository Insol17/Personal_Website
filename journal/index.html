<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal — KWAK TAEWOONG</title><style>:root{--bg:#091012;--panel:#11191c;--ink:#f4f5f1;--muted:rgba(255,255,255,.48);--line:rgba(255,255,255,.13);--pad:clamp(18px,3vw,46px);--latin:"Helvetica Neue",Arial,sans-serif;--ko:"Pretendard Variable","SUIT Variable","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;--ease:cubic-bezier(.16,1,.3,1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,rgba(52,87,87,.22),transparent 30%),var(--bg);color:var(--ink);font-family:var(--ko);-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}img{display:block;width:100%;height:100%;object-fit:cover}h1,h2,h3,p{margin:0}.mono{font-family:Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}.top{position:fixed;z-index:50;top:16px;left:50%;transform:translateX(-50%);width:min(820px,calc(100% - var(--pad)*2));min-height:48px;border:1px solid var(--line);border-radius:999px;background:rgba(9,16,18,.68);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:8px 14px}.top .brand{width:max-content;font:600 9px/1 Consolas,monospace;letter-spacing:.08em}.top nav{display:flex;gap:22px}.top nav a{font:500 8px/1 Consolas,monospace;color:var(--muted)}main{padding:130px var(--pad) 90px}.head{max-width:850px;margin:0 auto 62px;text-align:center}.head span{font:600 8px/1 Consolas,monospace;color:var(--muted);letter-spacing:.1em}.head h1{margin-top:20px;font:400 clamp(58px,9vw,126px)/.84 var(--latin);letter-spacing:-.065em}.head p{max-width:600px;margin:25px auto 0;color:var(--muted);font-size:13px;line-height:1.75}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font:600 8px/1 Consolas,monospace}.transition-layer{position:fixed;inset:0;z-index:10000;pointer-events:none;overflow:hidden;background:#071011}.transition-img{position:fixed;object-fit:cover;transition:left .62s var(--ease),top .62s var(--ease),width .62s var(--ease),height .62s var(--ease),border-radius .62s var(--ease)}.transition-layer.on .transition-img{left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0!important}@media(max-width:700px){main{padding:105px 16px 70px}.top{top:10px;width:calc(100% - 20px)}.top nav{gap:12px}.head{margin-bottom:42px}}</style><style>.bar{width:min(1080px,100%);margin:0 auto 24px;display:flex;justify-content:flex-end}.journal-list{width:min(1080px,100%);margin:auto;border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:120px 1fr 120px;gap:26px;padding:28px 4px;border-bottom:1px solid var(--line);align-items:start;transition:background .2s}.row:hover{background:rgba(255,255,255,.025)}.row .date,.row .cat{color:var(--muted);font:600 8px/1.4 Consolas,monospace}.row .cat{text-align:right}.row h2{font-size:clamp(20px,2.4vw,31px);font-weight:500;letter-spacing:-.03em}.row p{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.7}@media(max-width:650px){.row{grid-template-columns:82px 1fr}.row .cat{grid-column:2;text-align:left}}</style></head><body><header class="top"><a class="brand" href="../index.html">KWAK TAEWOONG</a><nav><a href="../index.html#journal">PORTFOLIO</a></nav></header><main><header class="head"><span>JOURNAL / ARCHIVE</span><h1>ALL JOURNALS</h1><p>프로젝트의 결과보다 과정에서 바뀐 판단과 시행착오를 기록하는 개인 블로그입니다.</p></header><div id="list" class="journal-list"></div><footer style="width:min(1080px,100%);margin:54px auto 0;padding-top:18px;border-top:1px solid var(--line);text-align:right"><a class="pill" href="admin.html" style="opacity:.36">OWNER</a></footer></main><script src="posts.js"></script><script>const list=document.querySelector('#list');(window.JOURNAL_POSTS||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(p=>{const a=document.createElement('a');a.className='row';a.href='post.html?slug='+encodeURIComponent(p.slug);a.innerHTML=`<span class="date">${p.date}</span><div><h2>${p.title}</h2><p>${p.excerpt}</p></div><span class="cat">${p.category}</span>`;list.appendChild(a)});</script></body></html>
