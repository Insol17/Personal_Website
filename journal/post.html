<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal — KWAK TAEWOONG</title><style>:root{--bg:#091012;--panel:#11191c;--ink:#f4f5f1;--muted:rgba(255,255,255,.48);--line:rgba(255,255,255,.13);--pad:clamp(18px,3vw,46px);--latin:"Helvetica Neue",Arial,sans-serif;--ko:"Pretendard Variable","SUIT Variable","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;--ease:cubic-bezier(.16,1,.3,1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,rgba(52,87,87,.22),transparent 30%),var(--bg);color:var(--ink);font-family:var(--ko);-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}img{display:block;width:100%;height:100%;object-fit:cover}h1,h2,h3,p{margin:0}.mono{font-family:Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}.top{position:fixed;z-index:50;top:16px;left:50%;transform:translateX(-50%);width:min(820px,calc(100% - var(--pad)*2));min-height:48px;border:1px solid var(--line);border-radius:999px;background:rgba(9,16,18,.68);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:8px 14px}.top .brand{width:max-content;font:600 9px/1 Consolas,monospace;letter-spacing:.08em}.top nav{display:flex;gap:22px}.top nav a{font:500 8px/1 Consolas,monospace;color:var(--muted)}main{padding:130px var(--pad) 90px}.head{max-width:850px;margin:0 auto 62px;text-align:center}.head span{font:600 8px/1 Consolas,monospace;color:var(--muted);letter-spacing:.1em}.head h1{margin-top:20px;font:400 clamp(58px,9vw,126px)/.84 var(--latin);letter-spacing:-.065em}.head p{max-width:600px;margin:25px auto 0;color:var(--muted);font-size:13px;line-height:1.75}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font:600 8px/1 Consolas,monospace}.transition-layer{position:fixed;inset:0;z-index:10000;pointer-events:none;overflow:hidden;background:#071011}.transition-img{position:fixed;object-fit:cover;transition:left .62s var(--ease),top .62s var(--ease),width .62s var(--ease),height .62s var(--ease),border-radius .62s var(--ease)}.transition-layer.on .transition-img{left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0!important}@media(max-width:700px){main{padding:105px 16px 70px}.top{top:10px;width:calc(100% - 20px)}.top nav{gap:12px}.head{margin-bottom:42px}}</style><style>.article{width:min(760px,100%);margin:auto}.article .meta{display:flex;justify-content:space-between;color:var(--muted);font:600 8px/1 Consolas,monospace;border-bottom:1px solid var(--line);padding-bottom:18px}.article h1{margin-top:34px;font-size:clamp(38px,6vw,72px);line-height:1.08;letter-spacing:-.055em;font-weight:500}.article .lead{margin-top:26px;color:rgba(255,255,255,.66);font-size:16px;line-height:1.75}.body{margin-top:54px;padding-top:34px;border-top:1px solid var(--line)}.body p{margin:0 0 25px;color:rgba(255,255,255,.72);font-size:15px;line-height:1.95}.back{margin-top:55px;display:inline-block}</style></head><body><header class="top"><a class="brand" href="../index.html">KWAK TAEWOONG</a><nav><a href="index.html">ALL JOURNALS</a></nav></header><main><article id="article" class="article"></article></main><script src="posts.js"></script><script>const slug=new URLSearchParams(location.search).get('slug');const p=(window.JOURNAL_POSTS||[]).find(x=>x.slug===slug);const el=document.querySelector('#article');if(!p){el.innerHTML='<h1>Journal not found.</h1><a class="back pill" href="index.html">BACK</a>'}else{document.title=p.title+' — Journal';el.innerHTML=`<div class="meta"><span>${p.date}</span><span>${p.category}</span></div><h1>${p.title}</h1><p class="lead">${p.excerpt}</p><div class="body">${(p.content||[]).map(x=>'<p>'+x+'</p>').join('')}</div><a class="back pill" href="index.html">← ALL JOURNALS</a>`}</script></body></html>
