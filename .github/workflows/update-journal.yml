name: Update Naver Journal

on:
  workflow_dispatch:
  schedule:
    # Once per hour, deliberately away from :00 where GitHub schedule load is often higher.
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: naver-journal-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync Naver RSS
        run: python scripts/automation/sync_naver_journal.py
      - name: Refresh inactivity keepalive when due
        run: python scripts/automation/refresh_keepalive.py
      - name: Commit feed / media / keepalive only when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first: `git diff` alone does not see a brand-new untracked journal.json.
          git add -A assets/data/journal.json assets/data/journal-media .github/journal-keepalive
          if git diff --cached --quiet; then
            echo "No journal or keepalive changes"
            exit 0
          fi
          git commit -m "chore: sync Naver journal"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
